:root{--bg:#f2f2e9;--card:#fff;--ink:#1d261c;--mut:#6a7366;--acc:#566127;--acc2:#3f481f;--line:#dcdacd;--warn:#b45309;--bad:#b3261e;--ok:#2f7d32;--blue:#1e5aa8;--chip:#ebeadf}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Arial,Helvetica,'Segoe UI',Roboto,sans-serif}
h1,h2,h3,.brand,.place .nm,.lbl b{font-family:'S452 Stencil','Arial Narrow',Arial,Helvetica,sans-serif;font-weight:400;letter-spacing:.02em}
header.top{background:#4b5320;color:#fff;padding:10px 14px;position:sticky;top:0;z-index:20}
.hrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:1100px;margin:0 auto}

.brand small{font-family:Arial,Helvetica,sans-serif;font-weight:400;opacity:.8;margin-left:6px;font-size:13px;letter-spacing:0}
.brand{display:flex;align-items:center;gap:8px;font-size:22px}.brand svg{width:30px;height:30px;flex:none}
.rolebadge{margin-left:auto;font-size:12px;background:rgba(255,255,255,.16);padding:3px 9px;border-radius:99px}
.searchwrap{position:relative;flex:1 1 100%;max-width:1100px;margin:8px auto 0}
.searchwrap input{width:100%;padding:11px 14px;border-radius:10px;border:0;font-size:16px}
#sres{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;color:var(--ink);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.28);max-height:65vh;overflow:auto;display:none;z-index:30}
#sres .it{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
#sres .it:last-child{border:0}
#sres .it:hover,#sres .it.sel{background:#eef2e8}
#sres .t{font-weight:600}
#sres .s{font-size:13px;color:var(--mut)}
#sres .none{padding:12px 14px;color:var(--mut)}
nav.tabs{background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
nav.tabs .in{max-width:1100px;margin:0 auto;display:flex}
nav.tabs a{padding:12px 16px;color:var(--ink);text-decoration:none;font-weight:600;border-bottom:3px solid transparent;display:inline-block}
nav.tabs a.on{border-color:var(--acc);color:var(--acc)}
main{max-width:1100px;margin:0 auto;padding:16px 14px 80px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:18px;margin:20px 0 8px}h3{font-size:16px;margin:14px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.mut{color:var(--mut)}.small{font-size:13px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-size:15px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--acc2)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid #b9b7a8}
.btn.sec:hover{background:var(--chip)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
.chip{display:inline-block;background:var(--chip);border-radius:99px;padding:2px 10px;font-size:12px;margin:2px 4px 2px 0}
.chip.ok{background:#e1e8c8;color:#3f481f}.chip.warn{background:#fbe6c8;color:#8a4a06}.chip.bad{background:#f7d6d3;color:#8d1c14}.chip.blue{background:#d9e6f6;color:#164a8a}
.list .li{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list .li:last-child{border:0}.list .li:hover{background:#f7f6f0}
.list .li .t{font-weight:600}
.grid{display:grid;gap:10px}
.place{background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px;min-height:92px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.place .n{font-size:12px;color:var(--mut);font-weight:700}
.place .nm{font-weight:700;font-size:14px;line-height:1.2}
.place.full{border-color:var(--acc);background:#f1f2e1}
.place.out{border-color:var(--warn);background:#fff6e8}
.place.empty{border-style:dashed;color:var(--mut)}
.place:hover{box-shadow:0 2px 10px rgba(0,0,0,.12)}
label.f{display:block;margin:8px 0}
label.f span{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;padding:9px 11px;border:1px solid #bdbbae;border-radius:8px;font-size:15px;background:#fff;font-family:inherit}
textarea{min-height:70px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:20px 12px;z-index:50;overflow:auto}
#modal .box{background:#fff;border-radius:14px;padding:18px;max-width:560px;width:100%}
#modal h2{margin-top:0}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;color:var(--mut);font-weight:600;border-bottom:2px solid var(--line);padding:6px 6px}
table.t td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.chk{display:flex;gap:8px;align-items:flex-start;padding:10px 6px;border-bottom:1px solid var(--line)}
.chk .nm{flex:1}
.stb{display:flex;gap:4px;flex-wrap:wrap}
.stb button{border:1px solid #b9b7a8;background:#fff;border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer}
.stb button.on.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.stb button.on.saknas{background:var(--bad);color:#fff;border-color:var(--bad)}
.stb button.on.trasig{background:var(--warn);color:#fff;border-color:var(--warn)}
.stb button.on.forbr{background:#6a7366;color:#fff;border-color:#6a7366}
.stb button.on.avv,.stb button.on.ofull{background:var(--blue);color:#fff;border-color:var(--blue)}
.units{margin:6px 0 2px 0;padding:8px;background:#f7f6f0;border-radius:8px}
.units .ut{font-weight:700;font-size:13px;margin:6px 0 2px}
.units label{display:flex;gap:8px;align-items:center;padding:3px 0}
.units input[type=checkbox]{width:20px;height:20px}
.progress{height:8px;background:var(--chip);border-radius:9px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--acc)}
.banner{background:#fff6e8;border:1px solid #e8c48a;border-radius:10px;padding:10px 12px;margin-bottom:12px}
.qrbox svg{width:160px;height:160px}
.lbls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lbl{border:1px dashed #888;padding:8px;text-align:center;page-break-inside:avoid}
.lbl svg{width:120px;height:120px}
.lbl b{display:block;font-size:18px}
.only-print{display:none}
@media (max-width:640px){.lbls{grid-template-columns:repeat(2,1fr)}}
@media print{
  .noprint,header.top,nav.tabs{display:none!important}
  .only-print{display:block}
  body{background:#fff}main{padding:0;max-width:none}
  .card{border:0;padding:0}
  table.t td,table.t th{font-size:11pt}
  .lbls{grid-template-columns:repeat(3,1fr)}
  a{color:inherit;text-decoration:none}
}
a{color:var(--acc2)}

nav.tabs .unitbar{background:#f1f0e4;border-top:1px solid var(--line);padding:0 8px}
nav.tabs .unitbar a{padding:7px 14px;font-size:13px}
.tblwrap{overflow-x:auto}
.tblwrap table.t td,.tblwrap table.t th{white-space:nowrap}
.tblwrap table.t td:nth-child(2){white-space:normal;min-width:160px}
.tl{width:64px;padding:4px 6px}
</style></head><body>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],
      [6, 30, 54],
      [6, 32, 58],
      [6, 34, 62],
      [6, 26, 46, 66],

  const ut=x=>multi?` <span class="chip">${esc(x.u)}</span>`:'';
  box.innerHTML=res.length?res.map((x,i)=>{ if(x.k==='a'){const a=x.o;return `<div class="it${i?'':' sel'}" data-act="go" data-unit="${esc(x.u)}" data-to="#/a/${a.id}"><div class="t">${esc(a.namn)} ${a.sats?'<span class="chip blue">sats</span>':''}${ut(x)}</div><div class="s">${esc(a.mnr)} · ${esc(x.w)}</div></div>`;}
    const c=x.o;return `<div class="it${i?'':' sel'}" data-act="go" data-unit="${esc(x.u)}" data-to="#/k/${c.id}"><div class="t">▣ ${esc(c.namn)} <span class="chip">${esc(c.id)}</span>${ut(x)}</div><div class="s">${esc(c.typ)} · ${esc(x.w)}</div></div>`;}).join(''):'<div class="none">Inga träffar</div>';

function openModal(h){const m=$('#modal');m.innerHTML='<div class="box">'+h+'</div>';m.style.display='flex';const f=m.querySelector('input[type=text],input[type=number],select');if(f&&!('ontouchstart' in window))f.focus();}

function go(h){ if(location.hash===h) route(); else location.hash=h; }
function qrSvg(text,size){ const q=qrcode(0,'M'); q.addData(text); q.make(); return q.createSvgTag({cellSize:4,margin:2,scalable:true}); }
function colliUrl(id){ return location.href.split('#')[0]+'#/k/'+id; }
function download(name,text,mime){const b=new Blob([text],{type:mime||'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

const katById=id=>DB.kat.find(k=>k.id===id);
const katName=a=>{const k=a&&a.kat&&katById(a.kat);return k?k.namn:'';};
const katIdx=a=>{const i=DB.kat.findIndex(k=>k.id===a.kat);return i<0?999:i;};
const katChip=a=>{const k=a&&a.kat&&katById(a.kat);return k?`<span class="chip" style="background:${esc(k.farg)};color:#fff">${esc(k.namn)}</span>`:'';};

let RACK_SEL=null, ART_FILTER='alla', ART_Q='';
const TABS0=[['#/','Pallställ'],['#/kollin','Kollin'],['#/art','Artiklar'],['#/inv','Inventering'],['#/order','Order'],['#/mer','Mer']];
const tabsFor=()=>isKvm()?[['#/kompani','Kompani']].concat(TABS0):TABS0;
function shell(title,body){ const TABS=tabsFor(); const h=location.hash||'#/'; const base='#/'+(h.split('/')[1]||'');
  const on=t=>{ if(t==='#/') return base==='#/'||base==='#/rack'; if(t==='#/kollin') return base==='#/kollin'||base==='#/k'; if(t==='#/art') return base==='#/art'||base==='#/a'; if(t==='#/inv') return ['#/inv','#/s','#/rapport'].includes(base); if(t==='#/order') return base==='#/order'; if(t==='#/kompani') return base==='#/kompani'; return ['#/mer','#/etiketter','#/logg','#/signaler','#/etikett'].includes(base)};
  $('#tabs').innerHTML='<div class="in">'+TABS.map(t=>`<a href="${t[0]}" class="${on(t[0])?'on':''}">${t[1]}${t[0]==='#/order'&&unread()?' <span class="chip bad" style="margin:0 0 0 4px">'+unread()+'</span>':''}</a>`).join('')+'</div>'+(isKvm()?'<div class="in unitbar"><span class="small mut" style="align-self:center">Enhet:</span>'+COMP.units.map(u=>`<a href="#/" data-act="unit" data-id="${esc(u.id)}" class="${u.id===curUnitId()&&base!=='#/kompani'?'on':''}">${esc(u.namn||u.id)}</a>`).join('')+'</div>':'');
  $('#view').innerHTML=body; document.title=title+' · Materiel'; window.scrollTo(0,0);
  roleTxt(); }

function viewRack(){ if(!RACK_SEL||!rack(RACK_SEL)) RACK_SEL=DB.racks[0]&&DB.racks[0].id; const r=rack(RACK_SEL);
  let h='<h1>Pallställ</h1><div class="row noprint" style="margin-bottom:10px">'+DB.racks.map(x=>`<button class="btn ${x.id===RACK_SEL?'':'sec'} sm" data-act="rack" data-id="${x.id}">${esc(x.namn)}</button>`).join('')+(isAdmin()?'<button class="btn sec sm" data-act="rackform" data-id="">+ Nytt pallställ</button>':'')+'</div>';
  if(!r){ return shell('Pallställ',h+'<div class="card mut">Inget pallställ finns ännu.</div>'); }
  const items=[];for(let n=1;n<=r.platser;n++){const c=DB.colli.find(c=>c.rackId===r.id&&c.plats===n);items.push(c?`<div class="place ${c.ute?'out':'full'}" data-act="go" data-to="#/k/${c.id}"><span class="n">PLATS ${n}</span><span class="nm">${esc(c.namn)}</span><span class="small mut">${esc(c.typ)}</span>${c.ute?'<span class="chip warn">Ute: '+esc(c.ute.grupp||'')+'</span>':''}</div>`:`<div class="place empty" data-act="placeform" data-rack="${r.id}" data-plats="${n}"><span class="n">PLATS ${n}</span><span class="small">Ledig</span></div>`);}
  h+=`<div class="grid" style="grid-template-columns:repeat(${r.kol||4},minmax(0,1fr))">${items.join('')}</div>`;
  const used=DB.colli.filter(c=>c.rackId===r.id).length;
  h+=`<p class="mut small">${used} av ${r.platser} platser upptagna. Tryck på en plats för att se vad kollit innehåller.</p>`;
  if(isAdmin()) h+=`<div class="row noprint"><button class="btn sec sm" data-act="rackform" data-id="${r.id}">Redigera pallställ</button></div>`;
  const lost=DB.colli.filter(c=>!c.plats||!c.rackId);
  if(lost.length) h+=`<h2>Kollin utan plats i ställ</h2><div class="card list">${lost.map(c=>colliLi(c)).join('')}</div>`;
  const ute=DB.colli.filter(c=>c.ute); if(ute.length) h+=`<h2>Utlämnade kollin</h2><div class="card list">${ute.map(c=>colliLi(c)).join('')}</div>`;
  shell('Pallställ',h); }

function rackForm(id){ if(!needAdmin())return; const r=id?rack(id):null;

  const rs=radC(id); let h=`<div class="row"><h1 class="grow">▣ ${esc(c.namn)} <span class="chip">${esc(c.id)}</span></h1></div>`;

  <div class="row noprint" style="margin-top:10px">${c.ute?'<button class="btn" data-act="startsess" data-typ="aterst" data-colli="'+c.id+'">Återställ (checklista)</button>':'<button class="btn" data-act="startsess" data-typ="inv" data-colli="'+c.id+'">Inventera</button><button class="btn sec" data-act="utform" data-id="'+c.id+'">Lämna ut</button><button class="btn sec" data-act="startsess" data-typ="aterst" data-colli="'+c.id+'">Återställ</button>'}<button class="btn sec" data-act="moveform" data-id="${c.id}">Flytta till plats</button><button class="btn sec" data-act="label" data-id="${c.id}">Skriv ut etikett</button>${isAdmin()?'<button class="btn sec" data-act="colliform" data-id="'+c.id+'">Redigera</button>':''}</div></div>`;
  h+=`<div class="row"><h2 class="grow">Innehåll (${rs.length} rader)</h2>${isAdmin()?'<button class="btn sm noprint" data-act="radform" data-colli="'+c.id+'">+ Lägg till artikel</button>':''}</div><div class="card" style="padding:4px 10px"><table class="t"><tr><th>Artikel</th><th>Antal</th>${isAdmin()?'<th></th>':''}</tr>`+
  (rs.length?(()=>{let lastK='~';return rs.slice().sort((x,y)=>katIdx(art(x.art)||{})-katIdx(art(y.art)||{})).map(r=>{const a=art(r.art);if(!a)return '';let hd='';if(a.kat!==lastK){lastK=a.kat;const kk=katById(a.kat);hd=`<tr><td colspan="3" style="background:#f7f6f0"><b>${esc(kk?kk.namn:'Utan kategori')}</b></td></tr>`;} return hd+`<tr><td><a href="#/a/${a.id}"><b>${esc(a.namn)}</b></a> ${a.sats?'<span class="chip blue">sats – stasslista</span>':''}<div class="small mut">${esc(a.mnr)}${r.ind&&r.ind.length?' · ind.nr '+esc(r.ind.join(', ')):''}</div></td><td>${r.antal}</td>${isAdmin()?`<td><button class="btn sec sm" data-act="radform" data-id="${r.id}">Ändra</button></td>`:''}</tr>`}).join('');})():'<tr><td colspan="3" class="mut">Kollit är tomt.</td></tr>')+'</table></div>';
  shell(c.namn,h); }
function colliForm(id){ if(!needAdmin())return; const c=id?colli(id):null; const nid=c?c.id:'K-'+String(DB.colli.length+1).padStart(2,'0');
  openModal(`<h2>${c?'Redigera kolli':'Nytt kolli'}</h2><form data-form="colli" data-id="${id||''}"><label class="f"><span>Kolli-ID (syns på QR-etiketten)</span><input type="text" name="id" value="${esc(nid)}" ${c?'readonly':''} required></label><label class="f"><span>Namn</span><input type="text" name="namn" value="${esc(c?c.namn:'')}" required></label><label class="f"><span>Typ</span><select name="typ">${COLLI_TYPER.map(t=>`<option ${c&&c.typ===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="f"><span>Notering</span><textarea name="not">${esc(c?c.not:'')}</textarea></label><div class="row"><button class="btn">Spara</button><button type="button" class="btn sec" data-act="close">Avbryt</button>${c?'<button type="button" class="btn bad" data-act="colliedel" data-id="'+c.id+'" style="margin-left:auto">Ta bort</button>':''}</div></form>`); }

  openModal(`<h2>${r?'Ändra rad':'Lägg till artikel i kolli'}</h2><form data-form="rad" data-id="${r?r.id:''}" data-colli="${cid}"><input type="hidden" name="art" value="${a?a.id:''}">

let ART_GROUP=false, ART_SEL=null;
function artLi(a){ const st=artStatus(a);const p=placed(a);const sel=ART_SEL?`<input type="checkbox" data-act="artchk" data-id="${a.id}" ${ART_SEL.has(a.id)?'checked':''} style="width:20px;height:20px">`:'';
  return `<div class="li" ${ART_SEL?'':'data-act="go" data-to="#/a/'+a.id+'"'}>${sel}<div class="grow" ${ART_SEL?'data-act="go" data-to="#/a/'+a.id+'"':''}><div class="t">${esc(a.namn)} ${a.sats?'<span class="chip blue">sats</span>':''}</div><div class="small mut">${esc(a.mnr)} ${katChip(a)}</div></div><div style="text-align:right"><div><b>${p}</b> / ${a.total}</div>${st==='ok'?'<span class="chip ok">Placerad</span>':st==='ej'?'<span class="chip warn">Ej placerad</span>':st==='sakn'?'<span class="chip bad">Saknar '+(a.total-p)+'</span>':'<span class="chip bad">Överskott '+(p-a.total)+'</span>'}</div></div>`; }
function viewArts(){ let list=DB.arts.slice(); const q=ART_Q.trim();
  if(q){const s=searchAll(q).filter(x=>x.k==='a').map(x=>x.o.id);list=list.filter(a=>s.includes(a.id));list.sort((x,y)=>s.indexOf(x.id)-s.indexOf(y.id));} else list.sort((x,y)=>x.namn.localeCompare(y.namn,'sv'));
  const base={alla:()=>true,ej:a=>artStatus(a)==='ej',avv:a=>['sakn','over'].includes(artStatus(a)),sats:a=>a.sats};
  const F=k=>base[k]||(k.startsWith('k:')?(a=>(a.kat||'')===k.slice(2)):base.alla);
  if(ART_FILTER!=='alla'&&!base[ART_FILTER]&&!ART_FILTER.startsWith('k:')) ART_FILTER='alla';
  const cnt=k=>DB.arts.filter(F(k)).length; list=list.filter(F(ART_FILTER));
  const btn=(k,l)=>`<button class="btn ${ART_FILTER===k?'':'sec'} sm" data-act="artf" data-k="${esc(k)}">${esc(l)} (${cnt(k)})</button>`;
  let h=`<div class="row"><h1 class="grow">Artiklar</h1>${isAdmin()?'<button class="btn" data-act="artform" data-id="">+ Ny artikel</button>':''}</div><div class="row noprint" style="margin-bottom:6px">`+[['alla','Alla'],['ej','Ej placerade'],['avv','Antal avviker'],['sats','Satser']].map(x=>btn(x[0],x[1])).join('')+'</div><div class="row noprint" style="margin-bottom:8px">'+DB.kat.map(k=>`<button class="btn ${ART_FILTER==='k:'+k.id?'':'sec'} sm" data-act="artf" data-k="k:${k.id}" style="${ART_FILTER==='k:'+k.id?'background:'+esc(k.farg):'border-color:'+esc(k.farg)}">${esc(k.namn)} (${cnt('k:'+k.id)})</button>`).join('')+btn('k:','Utan kategori')+'</div>';
  h+=`<div class="row noprint" style="margin-bottom:8px"><label class="row" style="gap:6px"><input type="checkbox" data-act="artgroup" ${ART_GROUP?'checked':''} style="width:18px;height:18px"> Gruppera efter kategori</label>${isAdmin()?'<button class="btn sec sm" data-act="artselmode">'+(ART_SEL?'Klar med markering':'Markera flera')+'</button>':''}${isAdmin()?'<a class="btn sec sm" href="#/kategorier" style="text-decoration:none">Hantera kategorier</a>':''}</div>`;
  if(ART_SEL&&isAdmin()) h+=`<div class="card noprint" style="position:sticky;top:0;z-index:5"><div class="row"><b><span id="selcnt">${ART_SEL.size}</span> markerade</b><button class="btn sec sm" data-act="artselall">Markera alla i listan</button><select id="katsel" style="width:auto"><option value="">Utan kategori</option>${DB.kat.map(k=>`<option value="${k.id}">${esc(k.namn)}</option>`).join('')}</select><button class="btn sm" data-act="artselset">Sätt kategori</button></div></div>`;
  if(ART_GROUP){ const groups=DB.kat.map(k=>({n:k.namn,f:k.farg,l:list.filter(a=>a.kat===k.id)})).concat([{n:'Utan kategori',f:'#888',l:list.filter(a=>!katById(a.kat))}]).filter(g=>g.l.length);
    h+=groups.length?groups.map(g=>`<h3 style="border-left:6px solid ${esc(g.f)};padding-left:8px">${esc(g.n)} <span class="mut small">(${g.l.length})</span></h3><div class="card list">${g.l.map(artLi).join('')}</div>`).join(''):'<div class="card mut">Inga artiklar.</div>'; }
  else h+=`<div class="card list">`+(list.length?list.map(artLi).join(''):'<div class="mut">Inga artiklar.</div>')+'</div>';
  window.__artList=list.map(a=>a.id); shell('Artiklar',h); }
function viewKategorier(){ if(!isAdmin()){shell('Kategorier','<div class="card">Bara enhetens chef eller KVM kan ändra kategorier.</div>');return;}
  let h='<h1>Kategorier</h1><div class="card"><p class="small mut" style="margin-top:0">Kategorierna är enhetens egna. Varje artikel har en kategori. Tar du bort en kategori hamnar dess artiklar under "Utan kategori".</p>'+DB.kat.map((k,i)=>{const n=DB.arts.filter(a=>a.kat===k.id).length;return `<div class="row" style="margin-bottom:8px"><span style="width:18px;height:18px;border-radius:5px;background:${esc(k.farg)};display:inline-block"></span><input type="text" data-kn="${k.id}" value="${esc(k.namn)}" style="flex:1;min-width:120px"><select data-kf="${k.id}" style="width:auto">${KAT_FARGER.map((f,j)=>`<option value="${f}" ${f===k.farg?'selected':''}>${['Grön','Blå','Orange','Lila','Röd','Turkos','Brun','Grå'][j]}</option>`).join('')}</select><span class="small mut">${n} art.</span><button class="btn sec sm" data-act="katup" data-id="${k.id}" ${i?'':'disabled'}>↑</button><button class="btn sec sm" data-act="katdn" data-id="${k.id}" ${i<DB.kat.length-1?'':'disabled'}>↓</button><button class="btn bad sm" data-act="katrm" data-id="${k.id}">Ta bort</button></div>`}).join('')+'<form data-form="kat" class="row"><input type="text" name="namn" placeholder="Ny kategori, t.ex. Optik" style="flex:1" required><button class="btn">+ Lägg till</button></form></div>';

function viewArt(id){ const a=art(id); if(!a){shell('Saknas','<div class="card">Artikeln finns inte. <a href="#/art">Till artiklar</a></div>');return;}
  const rs=radA(id), p=placed(a), st=artStatus(a);
  let h=`<div class="row"><h1 class="grow">${esc(a.namn)} ${a.sats?'<span class="chip blue">sats</span>':''}</h1>${isAdmin()?'<button class="btn sec noprint" data-act="artform" data-id="'+a.id+'">Redigera</button>':''}</div>`;
  h+=`<div class="card"><div>M-nummer: <b>${esc(a.mnr)}</b>${a.kat?' · '+katChip(a):''}</div><div>Totalt antal: <b>${a.total}</b> · Placerat i kollin: <b>${p}</b> ${st==='ok'?'<span class="chip ok">stämmer</span>':st==='ej'?'<span class="chip warn">ej placerad</span>':st==='sakn'?'<span class="chip bad">saknar '+(a.total-p)+' i packplanen</span>':'<span class="chip bad">överskott '+(p-a.total)+'</span>'}</div>${a.kommentar?'<div class="mut small">Kommentar: '+esc(a.kommentar)+'</div>':''}${a.ind&&a.ind.length?'<div class="small">Individnummer: '+esc(a.ind.join(', '))+'</div>':''}</div>`;
  h+=`<div class="row"><h2 class="grow">Var finns den?</h2>${isAdmin()?'<button class="btn sm noprint" data-act="radform2" data-art="'+a.id+'">+ Lägg i kolli</button>':''}</div><div class="card" style="padding:4px 10px"><table class="t"><tr><th>Kolli</th><th>Plats</th><th>Antal</th></tr>`+(rs.length?rs.map(r=>{const c=colli(r.colli);return c?`<tr><td><a href="#/k/${c.id}">${esc(c.namn)}</a><div class="small mut">${esc(c.typ)}</div></td><td>${esc(platsTxt(c))}</td><td>${r.antal}</td></tr>`:''}).join(''):'<tr><td colspan="3" class="mut">Inte placerad i något kolli ännu.</td></tr>')+'</table></div>';
  if(a.sats){ h+=`<div class="row"><h2 class="grow">Stasslista (innehåll i satsen)</h2><button class="btn sec sm noprint" onclick="window.print()">Skriv ut</button></div><div class="card" style="padding:4px 10px"><table class="t"><tr><th>Del</th><th>Antal per sats</th>${isAdmin()?'<th></th>':''}</tr>`+(a.stas.length?a.stas.map(s=>`<tr><td>${esc(s.del)}</td><td>${s.antal}</td>${isAdmin()?`<td><button class="btn sec sm" data-act="stasdel" data-art="${a.id}" data-id="${s.id}">Ta bort</button></td>`:''}</tr>`).join(''):'<tr><td colspan="3" class="mut">Ingen stasslista inlagd ännu.</td></tr>')+'</table>'+(isAdmin()?`<form data-form="stas" data-art="${a.id}" class="row noprint" style="margin:8px 0"><input type="text" name="del" placeholder="Del, t.ex. Hammare" style="flex:2" required><input type="number" name="antal" min="1" value="1" style="width:80px"><button class="btn sm">+ Lägg till del</button></form>`:'')+'</div>'; }
  shell(a.namn,h); }
function artForm(id){ if(!needAdmin())return; const a=id?art(id):null;
  openModal(`<h2>${a?'Redigera artikel':'Ny artikel'}</h2><form data-form="art" data-id="${id||''}"><label class="f"><span>Artikelnamn (materielbeteckning)</span><input type="text" name="namn" value="${esc(a?a.namn:'')}" required></label><label class="f"><span>Artikelnummer (M-nummer)</span><input type="text" name="mnr" value="${esc(a?a.mnr:'')}"></label><label class="f"><span>Antal i enheten</span><input type="number" name="total" min="0" value="${a?a.total:1}"></label><label class="f"><span>Kategori</span><div class="row"><select name="kat" id="katsel2" style="flex:1"><option value="">Utan kategori</option>${DB.kat.map(k=>`<option value="${k.id}" ${a&&a.kat===k.id?'selected':''}>${esc(k.namn)}</option>`).join('')}</select><button type="button" class="btn sec sm" data-act="katnew">+ Ny kategori</button></div></label><label class="f"><span>Individnummer (valfritt, komma-separerat)</span><input type="text" name="ind" value="${esc(a&&a.ind?a.ind.join(', '):'')}"></label><label class="f"><span>Kommentar</span><textarea name="kommentar">${esc(a?a.kommentar:'')}</textarea></label><label class="f" style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="sats" ${a&&a.sats?'checked':''} style="width:20px;height:20px"><b>Artikeln är en sats</b> <span class="mut small">(öppnar en egen inventeringslista, stasslistan)</span></label><div class="row"><button class="btn">Spara</button><button type="button" class="btn sec" data-act="close">Avbryt</button>${a?'<button type="button" class="btn bad" data-act="artdel" data-id="'+a.id+'" style="margin-left:auto">Ta bort</button>':''}</div></form>`); }

/* ---- Inventering / Återställning ---- */
const sess=id=>DB.sess.find(s=>s.id===id);
const sTitle=s=>(s.typ==='inv'?'Inventering':'Återställning');
function resOf(s,rid){ return s.res[rid]||(s.res[rid]={st:null,found:null,note:'',units:{}}); }
function sessRows(s){ return s.scope.flatMap(cid=>radC(cid)); }
function sessProgress(s,cid){ const rs=cid?radC(cid):sessRows(s); const d=rs.filter(r=>s.res[r.id]&&s.res[r.id].st).length; return [d,rs.length]; }
function startSess(typ,scope,label){ const s={id:uid('S'),typ,t:now(),signal:SET.signal||'',scope,label,res:{},done:false}; DB.sess.unshift(s); logEv('Startade '+sTitle(s).toLowerCase()+': '+label); save(); go('#/s/'+s.id); }
function viewInv(){ let h='<h1>Inventering och återställning</h1>';
  const open=DB.sess.filter(s=>!s.done), done=DB.sess.filter(s=>s.done);
  h+=`<div class="card"><h3 style="margin-top:0">Starta ny</h3><form data-form="newsess"><div class="row"><label class="f grow"><span>Typ</span><select name="typ"><option value="inv">Inventering (räkna och kontrollera)</option><option value="aterst">Återställning efter övning/insats</option></select></label><label class="f grow"><span>Omfattning</span><select name="omf"><option value="all">Hela enhetens materiel</option>${DB.racks.map(r=>`<option value="rack:${r.id}">${esc(r.namn)}</option>`).join('')}<option value="ute">Alla utlämnade kollin</option><option value="pick">Välj kollin…</option></select></label></div><button class="btn">Starta</button></form></div>`;
  const li=s=>{const [d,n]=sessProgress(s);return `<div class="li" data-act="go" data-to="#/${s.done?'rapport':'s'}/${s.id}"><div class="grow"><div class="t">${sTitle(s)} · ${esc(s.label)}</div><div class="small mut">${esc(s.t)}${s.signal?' · '+esc(s.signal):''} · ${d}/${n} rader</div></div><span class="mut">›</span></div>`};
  if(open.length) h+='<h2>Pågående</h2><div class="card list">'+open.map(li).join('')+'</div>';
  if(done.length) h+='<h2>Avslutade</h2><div class="card list">'+done.map(li).join('')+'</div>';
  shell('Inventering',h); }
function pickForm(typ){ openModal(`<h2>Välj kollin</h2><form data-form="pick" data-typ="${typ}"><div style="max-height:50vh;overflow:auto">${DB.colli.map(c=>`<label class="chk"><input type="checkbox" name="c" value="${c.id}" style="width:20px;height:20px"><span class="nm">${esc(c.namn)} <span class="chip">${esc(c.id)}</span><div class="small mut">${esc(platsTxt(c))}</div></span></label>`).join('')}</div><div class="row" style="margin-top:10px"><button class="btn">Starta</button><button type="button" class="btn sec" data-act="close">Avbryt</button></div></form>`); }
function viewSess(id){ const s=sess(id); if(!s){go('#/inv');return;} if(s.done){go('#/rapport/'+id);return;}
  const [d,n]=sessProgress(s); const pct=n?Math.round(d/n*100):0;
  let h=`<div class="row"><h1 class="grow">${sTitle(s)}</h1></div><div class="card"><div class="row"><div class="grow"><b>${esc(s.label)}</b><div class="small mut">${esc(s.t)}</div></div><b>${d}/${n}</b></div><div class="progress" style="margin-top:8px"><i style="width:${pct}%"></i></div></div><div class="card list">`+
   s.scope.map(cid=>{const c=colli(cid);if(!c)return '';const [dd,nn]=sessProgress(s,cid);return `<div class="li" data-act="go" data-to="#/s/${s.id}/${c.id}"><div class="grow"><div class="t">▣ ${esc(c.namn)} <span class="chip">${esc(c.id)}</span></div><div class="small mut">${esc(platsTxt(c))}</div></div>${nn&&dd===nn?'<span class="chip ok">klar</span>':'<span class="chip">'+dd+'/'+nn+'</span>'}</div>`}).join('')+'</div>'+
   `<div class="row"><button class="btn" data-act="finish" data-id="${s.id}">Avsluta och visa rapport</button><button class="btn sec" data-act="sessdel" data-id="${s.id}">Avbryt och ta bort</button></div>`;
  shell(sTitle(s),h); }
function rowDone(s,r){ const st=s.res[r.id]&&s.res[r.id].st; return !!st; }
function viewCheck(sid,cid){ const s=sess(sid),c=colli(cid); if(!s||!c){go('#/inv');return;}
  const rs=radC(cid); const [d,n]=sessProgress(s,cid);
  let h=`<div class="row"><h1 class="grow">▣ ${esc(c.namn)}</h1><span class="chip">${esc(c.id)}</span></div><p class="mut">${sTitle(s)} · ${esc(platsTxt(c))} · ${d}/${n} avbockade</p><div class="card" style="padding:4px 10px">`;
  h+=rs.map(r=>{const a=art(r.art);if(!a)return '';const rr=resOf(s,r.id);const st=rr.st;
    let x=`<div class="chk" style="flex-wrap:wrap"><div class="nm"><b>${esc(a.namn)}</b> ${a.sats?'<span class="chip blue">sats</span>':''}<div class="small mut">${esc(a.mnr)} · ska finnas: <b>${r.antal}</b>${r.ind&&r.ind.length?' · ind.nr '+esc(r.ind.join(', ')):''}</div>${st&&st!=='ok'&&rr.found!=null&&!a.sats?`<div class="small">Funnet: ${rr.found}</div>`:''}${rr.note?'<div class="small">Not: '+esc(rr.note)+'</div>':''}</div>`;
    if(a.sats){ x+=`<div class="stb"><button class="${st?'on '+st:''}" data-act="togsats" data-s="${s.id}" data-r="${r.id}">${st?ST_LBL[st]:'Öppna stasslista'}</button></div>`; }
    else x+=`<div class="stb">${['ok','saknas','trasig','forbr'].map(k=>`<button class="${st===k?'on '+k:''}" data-act="setst" data-s="${s.id}" data-r="${r.id}" data-k="${k}">${k==='ok'?'✓ OK':ST_LBL[k]}</button>`).join('')}<button class="${st==='avv'?'on avv':''}" data-act="avv" data-s="${s.id}" data-r="${r.id}">Antal…</button><button data-act="note" data-s="${s.id}" data-r="${r.id}" title="Notering">✎</button></div>`;
    if(a.sats&&OPEN_SATS===r.id){ const nUnits=Math.max(1,+r.antal||1); x+='<div style="flex-basis:100%"><div class="units">'+(a.stas.length?'':'<div class="mut small">Stasslistan är tom. Lägg in delar under artikeln.</div>');
      for(let i=0;i<nUnits;i++){ const lab=(r.ind&&r.ind[i])?('Individnummer '+r.ind[i]):('Exemplar '+(i+1)); x+=`<div class="ut">${esc(lab)}</div>`+a.stas.map(sd=>{const v=(rr.units[i]||{})[sd.id];return `<label><input type="checkbox" data-act="unit" data-s="${s.id}" data-r="${r.id}" data-i="${i}" data-d="${sd.id}" ${v==='ok'?'checked':''}> <span>${esc(sd.del)} <span class="mut">(${sd.antal} st)</span></span></label>`}).join('')+(a.stas.length?`<button class="btn sec sm" data-act="unitall" data-s="${s.id}" data-r="${r.id}" data-i="${i}">Bocka alla</button>`:''); }
      x+='</div></div>'; }
    return x+'</div>'}).join('')||'<div class="mut" style="padding:10px">Kollit är tomt.</div>';
  h+='</div><div class="row"><button class="btn" data-act="allok" data-s="'+sid+'" data-c="'+cid+'">Allt OK i detta kolli</button><a class="btn sec" href="#/s/'+sid+'" style="text-decoration:none">Tillbaka</a></div>';
  shell(c.namn,h); }
let OPEN_SATS=null;
function setRes(s,rid,st,found,note){ const rr=resOf(s,rid); rr.st=st; if(found!==undefined)rr.found=found; if(note!==undefined)rr.note=note; save(); }
function satsRecalc(s,r){ const a=art(r.art),rr=resOf(s,r.id); const nUnits=Math.max(1,+r.antal||1); let all=0,ok=0;
  for(let i=0;i<nUnits;i++)for(const sd of a.stas){all++; if((rr.units[i]||{})[sd.id]==='ok')ok++;}
  if(!all){rr.st=null;} else if(ok===all){rr.st='ok';rr.found=r.antal;} else if(ok===0){rr.st=null;} else {rr.st='ofull';rr.found=r.antal;} }
function finishSess(id){ const s=sess(id); const [d,n]=sessProgress(s); const go2=()=>{ s.done=true; s.tEnd=now();
    if(s.typ==='aterst'){ for(const cid of s.scope){const c=colli(cid); if(c&&c.ute){const rs=radC(cid);if(rs.every(r=>s.res[r.id]&&s.res[r.id].st==='ok')){c.ute=null;}}} }
    logEv('Avslutade '+sTitle(s).toLowerCase()+': '+s.label); save(); go('#/rapport/'+id); };
  if(d<n&&!confirm((n-d)+' rader är inte avbockade och räknas som "ej kontrollerade". Avsluta ändå?'))return; go2(); }
function issues(s){ const out=[]; for(const cid of s.scope){const c=colli(cid);if(!c)continue; for(const r of radC(cid)){const rr=s.res[r.id];const a=art(r.art); if(!a)continue; if(!rr||!rr.st){out.push({c,r,a,k:'ejk'});continue;} if(rr.st!=='ok')out.push({c,r,a,k:rr.st,rr});}} return out; }
function viewReport(id){ const s=sess(id); if(!s){go('#/inv');return;} const rows=sessRows(s);
  const cnt={ok:0,saknas:0,trasig:0,forbr:0,avv:0,ofull:0,ejk:0}; rows.forEach(r=>{const st=s.res[r.id]&&s.res[r.id].st;cnt[st||'ejk']++;});
  const is=issues(s).sort((x,y)=>katIdx(x.a)-katIdx(y.a)); const felrap=REPORT_MODE==='fel';
  let h=`<div class="row noprint"><h1 class="grow">Rapport</h1><button class="btn sec" data-act="rmode" data-k="${felrap?'full':'fel'}">${felrap?'Visa full rapport':'Visa felrapport'}</button><button class="btn" onclick="window.print()">Skriv ut / spara som PDF</button></div>`;
  h+=`<div class="only-print"><h1>${felrap?'Felrapport':'Rapport'} – ${sTitle(s)}</h1></div><div class="card"><div><b>${esc(s.label)}</b></div><div class="small mut">Start ${esc(s.t)}${s.tEnd?' · Klar '+esc(s.tEnd):''}${s.signal?' · Anropssignal '+esc(s.signal):''}</div><div style="margin-top:8px">${cnt.ok} OK · ${cnt.saknas} saknas · ${cnt.trasig} trasiga · ${cnt.forbr} förbrukade · ${cnt.avv} antal avviker · ${cnt.ofull} ofullständiga satser · ${cnt.ejk} ej kontrollerade</div></div>`;
  { const kt=[...DB.kat.map(k=>({id:k.id,n:k.namn})),{id:'',n:'Utan kategori'}].map(k=>{const rr=rows.filter(r=>{const a=art(r.art);return a&&(a.kat||'')===k.id||a&&!katById(a.kat)&&k.id===''&&a.kat;});const bad=rr.filter(r=>{const st=s.res[r.id]&&s.res[r.id].st;return st!=='ok';}).length;return {n:k.n,tot:rr.length,bad};}).filter(x=>x.tot); if(kt.length) h+=`<h2>Per kategori</h2><div class="card" style="padding:4px 10px"><table class="t"><tr><th>Kategori</th><th>Rader</th><th>Avvikelser</th></tr>${kt.map(x=>`<tr><td>${esc(x.n)}</td><td>${x.tot}</td><td>${x.bad?'<b>'+x.bad+'</b>':'0'}</td></tr>`).join('')}</table></div>`; }
  if(is.length){ h+=`<h2>${felrap?'Felrapport':'Avvikelser'}</h2><div class="card" style="padding:4px 10px"><table class="t"><tr><th>Kolli</th><th>Artikel</th><th>Ska finnas</th><th>Status</th></tr>${is.map(x=>`<tr><td>${esc(x.c.namn)}<div class="small mut">${esc(platsTxt(x.c))}</div></td><td>${esc(x.a.namn)}<div class="small mut">${esc(x.a.mnr)} ${katChip(x.a)}</div></td><td>${x.r.antal}</td><td>${x.k==='ejk'?'Ej kontrollerad':ST_LBL[x.k]}${x.rr&&x.rr.found!=null&&x.k!=='ok'&&!x.a.sats?' (funnet '+x.rr.found+')':''}${x.rr&&x.rr.note?'<div class="small">'+esc(x.rr.note)+'</div>':''}${x.a.sats&&x.k==='ofull'?satsMiss(s,x):''}</td></tr>`).join('')}</table></div>`; }
  else h+='<div class="card"><span class="chip ok">Inga avvikelser</span></div>';
  if(!felrap){ h+='<h2>Alla rader</h2>'+s.scope.map(cid=>{const c=colli(cid);if(!c)return '';return `<h3>▣ ${esc(c.namn)} <span class="chip">${esc(c.id)}</span></h3><div class="card" style="padding:4px 10px"><table class="t"><tr><th>Artikel</th><th>Antal</th><th>Status</th></tr>${radC(cid).map(r=>{const a=art(r.art);const rr=s.res[r.id];const st=rr&&rr.st;return `<tr><td>${esc(a?a.namn:'?')}</td><td>${r.antal}</td><td>${st?ST_LBL[st]:'—'}</td></tr>`}).join('')}</table></div>`}).join('');
    if(s.typ==='inv'&&s.scope.length>=DB.colli.length){ const rows2=DB.arts.map(a=>{const sum=radA(a.id).reduce((t,r)=>{const rr=s.res[r.id];const f=rr&&rr.st==='ok'?+r.antal:(rr&&rr.found!=null&&rr.st!=='saknas'?+rr.found:0);return t+f},0);return {a,sum}}).filter(x=>x.sum!==x.a.total); if(rows2.length) h+=`<h2>Total avvikelse mot artikelregistret</h2><div class="card" style="padding:4px 10px"><table class="t"><tr><th>Artikel</th><th>Registret</th><th>Funnet</th></tr>${rows2.map(x=>`<tr><td>${esc(x.a.namn)}</td><td>${x.a.total}</td><td>${x.sum}</td></tr>`).join('')}</table></div>`; } }
  h+=`<div class="row noprint"><button class="btn sec" data-act="reopen" data-id="${s.id}">Öppna igen</button><button class="btn sec" data-act="sessdel" data-id="${s.id}">Ta bort rapporten</button></div>`;
  shell('Rapport',h); }
let REPORT_MODE='full';
function satsMiss(s,x){ const rr=x.rr,a=x.a,out=[]; const n=Math.max(1,+x.r.antal||1); for(let i=0;i<n;i++){const miss=a.stas.filter(sd=>(rr.units[i]||{})[sd.id]!=='ok').map(sd=>sd.del); if(miss.length)out.push((x.r.ind&&x.r.ind[i]?'Ind.nr '+x.r.ind[i]:'Exemplar '+(i+1))+': saknar '+miss.join(', '));} return '<div class="small">'+out.map(esc).join('<br>')+'</div>'; }
/* ---- Mer ---- */
function viewMer(){ let h='<h1>Mer</h1>';
  if(!CLOUD){ const grp=(lab,l)=>l.length?`<optgroup label="${esc(lab)}">${l.map(x=>`<option value="${esc(x.signal)}" ${x.signal===SET.signal?'selected':''}>${esc(x.signal)} – ${esc(x.funk)}</option>`).join('')}</optgroup>`:'';
    const i=sigInfo(SET.signal); const txt=!i?'Okänd signal – du kan bara läsa.':i.roll==='kvm'?'Du är KVM: du ser och ändrar alla enheter och skickar meddelanden till enheterna.':i.roll==='stab'?'Du är enhetens chef: du ändrar enhetens packplan och ger order till dess grupper.':'Du hämtar ut, bockar av, återställer och svarar på order.';
    h+=`<div class="card"><h3 style="margin-top:0">Användare (provversion)</h3><label class="f"><span>Jag är (anropssignal). I riktiga versionen styrs den av din behörighetsnyckel.</span><select id="sigsel">${grp('Kompani',kompSigs())+COMP.units.map(u=>grp((u.namn||u.id)+(u.typ==='tross'?' (stab och tross)':''),sigListOf(u.d))).join('')}</select></label><div class="small mut">${txt}</div></div>`; }
  h+=cloudAccountCard();
  h+=`<div class="card"><h3 style="margin-top:0">Etiketter och rapporter</h3><div class="row"><a class="btn sec" href="#/etiketter" style="text-decoration:none">QR-etiketter för alla kollin</a><a class="btn sec" href="#/logg" style="text-decoration:none">Ändringslogg</a>${isAdmin()?'<a class="btn sec" href="#/signaler" style="text-decoration:none">Signalregister</a><a class="btn sec" href="#/kategorier" style="text-decoration:none">Kategorier</a>':''}</div></div>`;
  if(isAdmin()) h+=`<div class="card"><h3 style="margin-top:0">Data</h3><div class="row"><button class="btn sec" data-act="export">Spara säkerhetskopia (JSON${isKvm()?', hela kompaniet':', '+esc(curUnitId())})</button>${CLOUD?'':'<label class="btn sec" style="margin:0">Läs in säkerhetskopia<input type="file" id="impjson" accept=".json" style="display:none"></label>'}<label class="btn sec" style="margin:0">Läs in artikellista (CSV)<input type="file" id="impcsv" accept=".csv,.txt" style="display:none"></label></div><p class="small mut">CSV: M-nummer;Benämning;Antal (en artikel per rad). Finns M-numret sedan tidigare uppdateras antalet.</p>${isKvm()&&!CLOUD?'<div class="row"><button class="btn bad sm" data-act="reset">Återställ provdata för hela kompaniet</button></div>':''}</div>`;
  h+=`<div class="card small mut">${CLOUD?'Data ligger i den gemensamma databasen och synkas mellan enheterna. Appen fungerar även utan täckning och skickar ändringarna när nätet är tillbaka.':'Lokal provversion. Data sparas bara i den här webbläsaren. QR-etiketter pekar på filens adress, så de fungerar i telefonen först när appen ligger på en webbadress.'}</div>`;
  shell('Mer',h); }
function viewLabels(){ const h=`<div class="row noprint"><h1 class="grow">QR-etiketter</h1><button class="btn" onclick="window.print()">Skriv ut</button></div><div class="lbls">${DB.colli.map(c=>`<div class="lbl">${qrSvg(colliUrl(c.id))}<b>${esc(c.id)}</b><div>${esc(c.namn)}</div><div class="small">${esc(c.typ)}</div></div>`).join('')}</div>`; shell('Etiketter',h); }

function recipSignals(m){ const out=new Set(); const all=sigList(); for(const t of (m.mott||[])){ if(t==='*') all.forEach(x=>out.add(x.signal)); else if(t.startsWith('G:')){ const g=DB.sig.grupper.find(x=>x.kod===t.slice(2)); if(g){out.add(g.gc);out.add(g.sgc);} } else if(t.startsWith('S:')) out.add(t.slice(2)); } return [...out].filter(Boolean); }

function tokSignals(t){ return recipSignals({status:'skickad',mott:[t]}); }

function route(){ if(CLOUD&&(typeof CL==='undefined'||!CL.ready)) return; syncUnit(); const h=location.hash||'#/'; if(CLOUD&&COMP&&!COMP.units.length&&!/^#\/mer/.test(h)){ shell('Start',cloudEmptyView()); return; } const p=h.split('/'); { const sr=$('#sres'); if(sr)sr.style.display='none'; } 
  try{
  if(h==='#/'||h==='#'||h==='') return viewRack();
  switch(p[1]){
   case 'kollin': return viewColliList();
   case 'k': return viewColli(p[2]);
   case 'art': return viewArts();
   case 'a': return viewArt(p[2]);
   case 'inv': return viewInv();
   case 's': return p[3]?viewCheck(p[2],p[3]):viewSess(p[2]);
   case 'rapport': return viewReport(p[2]);
   case 'mer': return viewMer();
   case 'etiketter': return viewLabels();
   case 'etikett': return viewLabel(p[2]);
   case 'logg': return viewLog();
   case 'signaler': return viewSignaler();
   case 'kategorier': return viewKategorier();
   case 'kompani': return p[2]==='order'?kordRoute(p):viewKompani();
   case 'order': if(!p[2]) return viewOrders(); if(p[2]==='ny'){ if(!WORK||WORK.kord||msgById(WORK.id)) WORK=newOrder(); return viewOrdForm(); } if(p[3]==='edit'){ if(!WORK||WORK.id!==p[2]){const o=msgById(p[2]); WORK=o?JSON.parse(JSON.stringify(o)):newOrder();} return viewOrdForm(); } return viewOrder(p[2]);
  }
  viewRack();
  }catch(e){ console.error(e); $('#view').innerHTML='<div class="card"><b>Något gick fel:</b> '+esc(e.message)+'</div>'; }
}

function unitStats(u){ return withUnit(u,()=>{ const arts=DB.arts; const inv=DB.sess.filter(s=>s.done&&s.typ==='inv').map(s=>s.tEnd||s.t||'').sort().pop()||'';

/* ---- parse individnummer ur listans kolumn D ---- */
function indFromList(raw,antal){ const res={}; let note=''; let s=String(raw==null?'':raw).replace(/\s+/g,' ').trim(); if(!s) return {res,note};
  const ids=Object.keys(antal); const has=u=>(+antal[u]||0)>0;
  const body=s.replace(/\([^)]*\)/g,' ');
  const re=/\b(AR|BR|CR|ER)(?=[\s\d\/.:]|$)/g; const pos=[]; let m; while((m=re.exec(body))) pos.push({u:m[1],a:m.index,b:m.index+m[0].length});
  const tok=t=>(t.match(/(?<![A-Za-z])[A-Z]{0,2}\d[\dA-Za-z\/]*/g)||[]).map(x=>x.replace(/\/+$/,'')).filter(x=>x.length>=2);
  if(pos.length){ pos.forEach((p,i)=>{ const seg=body.slice(p.b,i+1<pos.length?pos[i+1].a:undefined); if(has(p.u)){ const t=tok(seg); if(t.length) res[p.u]=(res[p.u]||[]).concat(t); } });
    const pre=body.slice(0,pos[0].a).trim(); if(pre&&/[A-Za-zÅÄÖåäö]{2,}/.test(pre)) note=s; return {res,note}; }
  const parts=body.split(/[,;\/\s+]+/).filter(Boolean);
  if(parts.length&&parts.every(x=>/^[A-Za-z]{0,3}\d\w*$/.test(x))){ const withA=ids.filter(has); const tgt=has('CR')?'CR':(withA.length===1?withA[0]:''); if(tgt&&parts.length<=(+antal[tgt]||0)){ res[tgt]=parts; return {res,note}; } }
  return {res,note:s}; }
function csvParts(line){ return line.split(/[;\t]/).map(x=>x.trim().replace(/^"|"$/g,'')); }
function importKomp(text){ const lines=text.replace(/^﻿/,'').split(/\r?\n/); let nArt=0,nUpd=0,nTl=0; const ids=COMP.units.map(u=>u.id);
  lines.forEach(l=>{ const c=csvParts(l); if(c.length<8||!c[0]) return; const mnr=c[0], namn=c[1];
    const antal={}; ids.forEach(id=>{ const k=['AR','BR','CR','ER'].indexOf(id); antal[id]=k>=0?(parseInt(c[4+k],10)||0):0; });
    const tl=parseInt(c[2],10); const isHdr=isNaN(tl)&&ids.every(id=>!antal[id]); if(isHdr&&!/\d/.test(mnr)) return;
    if(!isNaN(tl)){ const t=COMP.tilld.find(x=>x.mnr===mnr); if(t){t.antal=tl;t.namn=namn||t.namn;} else COMP.tilld.push({mnr,namn,antal:tl}); nTl++; }
    const ind=indFromList(c[3],antal); const kom=[c[9]||'', ind.note?('Ur listan: '+ind.note):''].filter(Boolean).join(' · ');
    COMP.units.forEach(u=>{ const n=antal[u.id]; if(!n) return; let a=u.d.arts.find(x=>x.mnr===mnr);
      if(a){ a.total=n; nUpd++; } else { a={id:uid('A'),mnr,namn,total:n,ind:[],sats:/\/\s?S\s*$/.test(namn),stas:[],kommentar:'',kat:''}; u.d.arts.push(a); nArt++; }
      if(ind.res[u.id]&&!(a.ind&&a.ind.length)) a.ind=ind.res[u.id]; if(kom&&!a.kommentar) a.kommentar=kom; }); });
  return {nArt,nUpd,nTl}; }

  if(k==='kmsg'){ e.preventDefault(); if(!needKvm())return; const us=COMP.units.filter(u=>fd['u_'+u.id]); if(!us.length){alert('Välj minst en enhet.');return;} const kid=uid('K'), to=[], saknas=[];
    us.forEach(u=>{ const stab=(u.d.sig.stab||[]).map(x=>x.signal).filter(Boolean); if(!stab.length){saknas.push(u.id);return;} const m={id:uid('M'),kid,typ:fd.typ,status:'skickad',titel:fd.titel.trim(),text:fd.text,colli:[],fran:SET.signal,t:now(),mott:stab.map(s=>'S:'+s),svar:[],lasta:{},kvm:true}; u.d.ordrar.unshift(m); to.push({unit:u.id,mid:m.id}); });
    if(!to.length){alert('Ingen av enheterna har en chef i signalregistret.');return;}
    COMP.kmsg.unshift({kid,typ:fd.typ,titel:fd.titel.trim(),text:fd.text,t:now(),fran:SET.signal,to}); logEv('Skickade '+fd.typ+' till '+to.map(x=>x.unit).join(', ')); save(); closeModal(); route(); if(saknas.length) alert('Ingen chef i signalregistret för: '+saknas.join(', ')+'. Meddelandet skickades inte dit.'); }
  if(k==='ksig'){ e.preventDefault(); if(!needKvm())return; const sg=fd.signal.trim(); if(identify(sg)){alert('Signalen finns redan i registret.');return;} const u=unitById(fd.enhet);
    if(fd.niva==='kompani') COMP.extra.push({signal:sg,funk:fd.funk.trim()});
    else if(fd.niva==='enhet') u.d.sig.stab.push({signal:sg,funk:fd.funk.trim()});
    else { const g=(fd.grupp||'').trim(); if(g&&!u.d.sig.grupper.some(x=>x.kod===g)){alert('Gruppen '+g+' finns inte i '+u.id+'. Lämna fältet tomt eller skriv en befintlig gruppkod.');return;} u.d.sig.funk.push({signal:sg,funk:fd.funk.trim(),grp:g}); }
    save(); route(); }
  if(k==='kunit'){ e.preventDefault(); if(!needKvm())return; const id=fd.id.trim().toUpperCase().replace(/\s+/g,''); if(!id)return; if(unitById(id)){alert('Enheten finns redan.');return;}
    const tross=fd.typ==='tross'; const n=tross?5:4; const d={kat:[],racks:[],colli:[],arts:[],rader:[],sess:[],log:[],ordrar:[],sig:{pluton:id,stab:tross?[{signal:id,funk:'Tropp C'}]:[{signal:id+' 1',funk:'Plut C'},{signal:id+' 2',funk:'Stf Plut C'}],grupper:tross?Array.from({length:n},(_,i)=>({kod:id+(i+1),gc:id+' '+(i+1)+'1',sgc:id+' '+(i+1)+'2'})):'EFGH'.split('').map(l=>({kod:l+id[0],gc:l+id[0]+' 1',sgc:l+id[0]+' 2'})),funk:[]}};
    COMP.units.push({id,namn:(fd.namn||'').trim()||id,typ:fd.typ,d}); ensureDB(d); save(); route(); }
},true);

const clone=o=>JSON.parse(JSON.stringify(o));
const korderById=id=>COMP.korder.find(o=>o.id===id);
const redrawOrd=()=>{ if(WORK&&WORK.kord) viewKOrdForm(); else viewOrdForm(); };
function newKOrder(){ const n=COMP.korder.length+1; return {kord:true,id:uid('KO'),status:'utkast',nr:'VOI-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-K'+n,fran:SET.signal,t:now(),plats:COMP.namn,period:{fran:'',till:''},ref:'',lage:'',mal:'',tider:[{tid:'',akt:''}],uppgift:'',enhetUppg:COMP.units.map(u=>({unit:u.id,on:false,text:'',plats:'',tid:''})),gemensam:[{text:'Hylsexercis/ammunitionskontroll: ingen skarp eller blind ammunition får ligga kvar i fickor, magasin eller fordon.',ansvar:'',tid:''}],logistik:{vard:'',drivmedel:'',mat:'',sjuk:''},ledning:{pc:'',stfpc:'',visit:''},to:[]}; }
function kordRoute(p){ if(!isKvm()){ shell('Kompani','<div class="card">Kompanivyn är bara för KVM.</div>'); return; }
  if(p[3]==='ny'){ if(!WORK||!WORK.kord||korderById(WORK.id)) WORK=newKOrder(); return viewKOrdForm(); }
  if(p[4]==='edit'){ if(!WORK||WORK.id!==p[3]){ const o=korderById(p[3]); WORK=o?clone(o):newKOrder(); } return viewKOrdForm(); }
  return viewKOrder(p[3]); }

  shell('Kompaniorder',h); }
function kordUnitStatus(o){ return (o.to||[]).map(x=>{ const u=unitById(x.unit); const m=u&&u.d.ordrar.find(q=>q.id===x.mid); if(!m) return {unit:x.unit,gone:true};
  const sv=(m.svar||[]).slice(-1)[0]; const las=Object.keys(m.lasta||{}); const eo=m.enhetOrder&&u.d.ordrar.find(q=>q.id===m.enhetOrder);
  let grp=null; if(eo&&eo.status==='skickad'){ const sg=withUnit(u,()=>recipSignals(eo)); const ans=new Set((eo.svar||[]).map(s=>s.signal)); const lasta=sg.filter(s=>eo.lasta&&eo.lasta[s]).length; grp={n:sg.length,svar:sg.filter(s=>ans.has(s)).length,lasta}; }
  return {unit:x.unit,mid:m.id,sv,las:las.length,eo:eo||null,grp}; }); }
function kordChips(o){ if(o.status!=='skickad') return '<span class="chip warn">Utkast</span>'; return kordUnitStatus(o).map(s=>{ if(s.gone) return `<span class="chip">${esc(s.unit)} borttagen</span>`; const st=s.eo?(s.eo.status==='skickad'?'order skickad':'order utkast'):(s.sv?s.sv.alt:(s.las?'läst':'ej läst')); const cl=s.eo&&s.eo.status==='skickad'?'ok':(s.eo?'warn':(s.sv?(SVAR_CLS[s.sv.alt]||'blue'):(s.las?'blue':'warn'))); return `<span class="chip ${cl}">${esc(s.unit)}: ${esc(st)}</span>`; }).join(' '); }
function kordSection(){ let h=`<div class="row noprint" style="margin-top:18px"><h2 class="grow" style="margin:0">Kompaniorder (VOI)</h2><button class="btn" data-act="kordnew">+ Ny kompaniorder</button></div><p class="small mut noprint">Skickas till enhetscheferna, som skriver om ordern för sin enhet och skickar den vidare till grupperna.</p><div class="card list noprint">`;

  const D=o.ledning; h+=sec('5. Ledning och samband',[['KC',D.pc],['KVM',D.stfpc],['Visitation',D.visit]].filter(x=>x[1]).map(x=>'<p><b>'+x[0]+':</b> '+nl(x[1])+'</p>').join(''));

      return `<tr><td><b>${esc(s.unit)}</b></td><td>${a}</td><td>${b}</td></tr>`; }).join('')+'</table></div>'; }

function korderBlock(m){ const e=m.enhetUppg||{}; const eo=m.enhetOrder&&msgById(m.enhetOrder); const chief=isAdmin()&&!isKvm();

Object.assign(ACT,{

 kordcancel:()=>{ const id=WORK&&WORK.id; WORK=null; go(id&&korderById(id)?'#/kompani/order/'+id:'#/kompani'); },
 kordedit:d=>{ WORK=clone(korderById(d.id)); go('#/kompani/order/'+d.id+'/edit'); },
 kordcopy:d=>{ const o=korderById(d.id); const w=newKOrder(); ['plats','ref','tider','uppgift','gemensam','logistik','ledning'].forEach(k=>w[k]=clone(o[k])); w.enhetUppg=clone(o.enhetUppg); WORK=w; go('#/kompani/order/ny'); },
 kordrm:d=>{ const o=korderById(d.id); if(!o||!needKvm())return; if(!confirm('Ta bort kompaniordern'+(o.status==='skickad'?' och dess kopior hos enheterna':'')+'?'))return; (o.to||[]).forEach(x=>{ const u=unitById(x.unit); if(u) u.d.ordrar=u.d.ordrar.filter(q=>q.id!==x.mid); }); COMP.korder=COMP.korder.filter(q=>q.id!==d.id); save(); go('#/kompani'); },
 kordsend:d=>{ const o=korderById(d.id); WORK=clone(o); ACT.kordsave({send:'1'}); },
 kordsave:d=>{ if(!needKvm())return; const w=WORK; const send=!!d.send; const re=/^\d{6}$/;
   if(send){ if(!re.test(w.period.fran)||!re.test(w.period.till)){alert('Skriv tidsperioden som sex siffror, DDHHMM (t.ex. 120800).');return;}
     const on=w.enhetUppg.filter(e=>e.on); if(!on.length){alert('Välj minst en enhet.');return;}
     const bad=on.filter(e=>!(e.text||'').trim()); if(bad.length){alert('Skriv en uppgift till: '+bad.map(e=>e.unit).join(', ')+'.');return;}
     const nochef=on.filter(e=>{ const u=unitById(e.unit); return !u||!(u.d.sig.stab||[]).some(x=>x.signal); }); if(nochef.length){alert('Ingen chef i signalregistret för: '+nochef.map(e=>e.unit).join(', ')+'.');return;} }
   w.fran=SET.signal; w.t=now();
   if(send){ w.to=[]; w.enhetUppg.filter(e=>e.on).forEach(e=>{ const u=unitById(e.unit); const stab=u.d.sig.stab.map(x=>x.signal).filter(Boolean);
       const m={id:uid('M'),kid:w.id,typ:'order',korder:true,kvm:true,status:'skickad',nr:w.nr,fran:SET.signal,t:now(),plats:w.plats,period:clone(w.period),ref:w.ref,lage:w.lage,mal:w.mal,tider:clone(w.tider),uppgift:w.uppgift,enhetUppg:{text:e.text,plats:e.plats,tid:e.tid},gruppUppg:[],gemensam:clone(w.gemensam.filter(g=>g.text)),logistik:clone(w.logistik),ledning:clone(w.ledning),mott:stab.map(s=>'S:'+s),svar:[],lasta:{},enhetOrder:''};
       u.d.ordrar.unshift(m); w.to.push({unit:e.unit,mid:m.id}); }); w.status='skickad'; logEv('Skickade kompaniorder '+w.nr+' till '+w.to.map(x=>x.unit).join(', ')); }
   else logEv('Sparade utkast till kompaniorder '+w.nr);
   const i=COMP.korder.findIndex(x=>x.id===w.id); if(i>=0)COMP.korder[i]=w; else COMP.korder.unshift(w); save(); WORK=null; go('#/kompani/order/'+w.id); },
 korderwrite:d=>{ const m=msgById(d.id); if(!m||!isAdmin())return; const ex=m.enhetOrder&&msgById(m.enhetOrder); if(ex){ go('#/order/'+ex.id+(ex.status==='utkast'?'/edit':'')); return; }
   const w=newOrder(); const e=m.enhetUppg||{}; w.ursprung=m.id; w.ref='Kompaniorder '+m.nr; w.plats=(DB.sig.pluton||''); w.period=clone(m.period); w.lage=m.lage; w.mal=m.mal; w.tider=clone(m.tider);
   w.uppgift=[e.text,e.plats?'Plats: '+e.plats:'',e.tid?'Tid: '+e.tid:''].filter(Boolean).join('\n'); w.gemensam=clone(m.gemensam); w.logistik=clone(m.logistik); WORK=w; go('#/order/ny'); },
});

/* ---- Molnet (Firebase) ----
   Lokalt läge (fil eller ?lokal): inget av detta används.
   Molnläge (https): Firestore är sanningen. COMP är en arbetskopia som synkas dokument för dokument. */
const CL={uid:'',sig:'',me:null,isKvm:false,ready:false,synced:new Map(),items:new Map(),sigdocs:new Map(),claims:new Map(),inflight:0,timer:null,unsubs:[],unitUnsubs:{},pending:0,pendingRender:false,rt:null,sigDirty:false,errs:0};
const COLLS=['arts','colli','rader','racks','kat','sess','ordrar','log'];
